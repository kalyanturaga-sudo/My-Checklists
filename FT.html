<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FT Job">
<title>FT Job Checklist</title>
<style>
  :root {
    --bg: #17151d;
    --card: #211e29;
    --card-border: #322e3d;
    --accent: #6366f1;
    --text: #f2f1f6;
    --text-dim: #8b8798;
    --done: #55506333;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 24px);
  }

  header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px 20px;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(160deg, #4f7cff, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .title-block { flex: 1; min-width: 0; }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: -0.2px;
  }

  .date {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
    margin-top: 3px;
  }

  .count {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }

  .bar-track {
    height: 3px;
    background: var(--card-border);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 4px 18px;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 4px 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  li.section-header:first-child { padding-top: 0; }

  li.section-header .sec-icon { font-size: 14px; }

  li.section-header .sec-label { cursor: default; }
  body.is-desktop li.section-header .sec-label { cursor: text; }

  li.section-header .sec-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  li.section-header .sec-progress {
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: normal;
    font-variant-numeric: tabular-nums;
  }

  .sec-del {
    display: none;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1;
    border-radius: 6px;
    cursor: pointer;
    text-transform: none;
  }

  body.is-desktop .sec-del { display: flex; }
  .sec-del:hover { background: #ef444422; color: #ef4444; }

  .add-category-row {
    display: none;
    justify-content: center;
    margin-top: 14px;
  }

  body.is-desktop .add-category-row { display: flex; }

  .add-category-btn {
    background: none;
    border: 1px dashed var(--card-border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .add-category-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .readonly-note {
    display: none;
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin: 2px 0 0;
  }

  body:not(.is-desktop) .readonly-note { display: block; }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 14px;
    transition: background 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  li.task.done {
    background: var(--done);
    opacity: 0.55;
  }

  li.task.drag-over {
    box-shadow: 0 0 0 2px var(--accent);
  }

  li.task.dragging {
    opacity: 0.35;
  }

  /* Drag handle — desktop (mouse) only, hidden entirely on touch/iPhone */
  .grip {
    display: none;
    width: 18px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    letter-spacing: -1px;
    cursor: grab;
    user-select: none;
    margin-top: 1px;
  }

  body.is-desktop .grip { display: block; }
  body.is-desktop li.task { cursor: default; }
  .grip:active { cursor: grabbing; }

  .indent-btn {
    display: none;
    width: 18px;
    height: 22px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 1px;
  }

  body.is-desktop .indent-btn { display: flex; }
  .indent-btn:hover { background: var(--card-border); color: var(--text); }
  .indent-btn.spacer { visibility: hidden; }

  li.task.sub {
    margin-left: 28px;
    background: #1b1922;
  }

  li.task.sub .box { width: 19px; height: 19px; border-radius: 5px; }
  li.task.sub .label { font-size: 14.5px; color: var(--text-dim); }
  li.task.sub.done .label { color: var(--text-dim); }

  .box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    cursor: pointer;
  }

  li.task.done .box {
    background: var(--accent);
  }

  .box svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }

  li.task.done .box svg { opacity: 1; }

  .label {
    font-size: 16px;
    line-height: 1.35;
    padding-top: 1px;
    flex: 1;
    min-width: 0;
  }

  li.task.done .label {
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  body.is-desktop .label { cursor: text; }

  .del {
    display: none;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    border-radius: 6px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  body.is-desktop .del { display: flex; }
  body.is-desktop li.task:hover .del { opacity: 1; }
  .del:hover { background: #ef444422; color: #ef4444; }

  .add-row {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px dashed var(--card-border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-top: 10px;
  }

  body.is-desktop .add-row { display: flex; }

  .add-row input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }

  .add-row input::placeholder { color: var(--text-dim); }

  .add-row button {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .add-row button:disabled { opacity: 0.4; cursor: default; }

  .label-input {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 3px 6px;
    width: 100%;
    line-height: 1.35;
  }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin: 4px 0 0;
    display: none;
  }

  body.is-desktop .hint { display: block; }

  .loading-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 0;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 26px;
    padding-bottom: 6px;
  }

  .reset {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
  }

  .reset:active { background: var(--card); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="icon">🧳</div>
    <div class="title-block">
      <h1>FT Job Checklist</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="progress">
      <span class="count" id="countLabel">0/0</span>
    </div>
  </header>

  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  <div id="loadingNote" class="loading-note">Loading checklist&hellip;</div>
  <ul class="tasks" id="taskList" style="display:none;"></ul>

  <div class="add-row">
    <input id="addInput" type="text" placeholder="Add a task&hellip;" autocomplete="off">
    <button id="addBtn" aria-label="Add task">+</button>
  </div>

  <div class="add-category-row">
    <button class="add-category-btn" id="addCategoryBtn">+ Category</button>
  </div>

  <p class="hint">&#9656; to make subtask &middot; drag &#8942;&#8942; to reorder &middot; double-click text to rename &middot; &times; to delete &middot; syncs to every device via Google Drive</p>
  <p class="readonly-note">Checklist layout is edited on the web version &middot; tap a row here to check it off</p>

  <button class="reset" id="resetBtn">Reset checklist</button>

  <footer>FT Job &middot; tap a row to check it off</footer>

</div>

<script src="storage.js"></script>
<script>
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  /* Flat ordered list mixing section headers (type:'header') with tasks
     (type:'task'). This mirrors the FT tab's default content from
     Checklists.html, just laid out for a single scrollable page. */
  const DEFAULT_ITEMS = [
    { id: 'h-actions',   type: 'header', icon: '🌙', label: 'Actions' },
    { id: 'iron',        type: 'task',   label: 'Iron clothes (do it in batch if working back2back)', sub: false },
    { id: 'perfume',     type: 'task',   label: 'Put perfume on ironed clothes', sub: true },
    { id: 'eve-shower',  type: 'task',   label: 'Eve-shower', sub: false },
    { id: 'shaving',     type: 'task',   label: 'Shaving', sub: false },
    { id: 'toupee-stick',type: 'task',   label: 'Toupee stickering', sub: false },
    { id: 'prep-lunch',  type: 'task',   label: 'Prep breakfast & pack lunch', sub: false },
    { id: 'shoes-socks', type: 'task',   label: 'Shoes & socks ready', sub: false },

    { id: 'h-mindset',   type: 'header', icon: '🧠', label: 'Mindset' },
    { id: 'sim-day',     type: 'task',   label: 'Think about whole day — run simulation in mind', sub: false },
    { id: 'weather',     type: 'task',   label: 'Check weather', sub: false },
    { id: 'plan-act',    type: 'task',   label: 'Plan activities / transportation / timings', sub: false },
    { id: 'docs-emails', type: 'task',   label: 'Any documents or emails to review?', sub: false },
    { id: 'umbrella',    type: 'task',   label: 'Umbrella or jacket needed?', sub: true },

    { id: 'h-toupee',    type: 'header', icon: '🧩', label: 'Toupee' },
    { id: 'toupee',      type: 'task',   label: 'Toupee', sub: false },
    { id: 'peel-old',    type: 'task',   label: 'Peel old stickers / clean residue', sub: true },
    { id: 'stick-new',   type: 'task',   label: 'Stick new tape', sub: true },
    { id: 'comb-hair',   type: 'task',   label: 'Comb hair / clear any debris on the hair', sub: true },
    { id: 'oil-if-dry',  type: 'task',   label: 'Slightly oil if it looks dry', sub: true },
    { id: 'extra-tape',  type: 'task',   label: 'Take extra tape', sub: false },
    { id: 'take-comb',   type: 'task',   label: 'Take comb', sub: false },

    { id: 'h-tech',      type: 'header', icon: '🔌', label: 'Tech' },
    { id: 'laptop',      type: 'task',   label: 'Laptop', sub: false },
    { id: 'laptop-chg',  type: 'task',   label: 'Laptop charger', sub: false },
    { id: 'mobile-chg',  type: 'task',   label: 'Mobile charger', sub: false },
    { id: 'watch-chg',   type: 'task',   label: 'Watch charger', sub: false },
    { id: 'earphones',   type: 'task',   label: 'Earphones', sub: false },
    { id: 'mouse',       type: 'task',   label: 'Mouse', sub: false },
    { id: 'usb-hub',     type: 'task',   label: 'USB hub', sub: false },

    { id: 'h-misc',      type: 'header', icon: '🎒', label: 'Misc' },
    { id: 'wallet',      type: 'task',   label: 'Wallet', sub: false },
    { id: 'keys',        type: 'task',   label: 'Keys', sub: false },
    { id: 'phone',       type: 'task',   label: 'Phone', sub: false },
    { id: 'watch',       type: 'task',   label: 'Watch', sub: false },
    { id: 'pen',         type: 'task',   label: 'Pen', sub: false },
    { id: 'notebook',    type: 'task',   label: 'Notebook', sub: false },
    { id: 'id-card',     type: 'task',   label: 'ID card', sub: false },
    { id: 'mask',        type: 'task',   label: 'Mask', sub: false },

    { id: 'h-hot',       type: 'header', icon: '🍳', label: 'Hot / Extras' },
    { id: 'night-shift',   type: 'task', label: 'If working on night shift', sub: false },
    { id: 'coffee-powder', type: 'task', label: 'Take coffee powder', sub: true },
    { id: 'round-bread',   type: 'task', label: 'Take round bread for omlette', sub: true },
    { id: 'premade-omlette', type: 'task', label: 'Take premade omlette', sub: true },
    { id: 'std-lunch',   type: 'task',   label: 'Standard lunch / dinner', sub: false },

    { id: 'h-snacks',    type: 'header', icon: '🥕', label: 'Snacks & Veg' },
    { id: 'carrots',     type: 'task',   label: 'Carrots', sub: false },
    { id: 'cucumber',    type: 'task',   label: 'Cucumber', sub: false },
    { id: 'chips',       type: 'task',   label: 'Chips', sub: false },
    { id: 'soda-coins',  type: 'task',   label: 'Thumbs Up / coins for soda', sub: false },
    { id: 'crackers',    type: 'task',   label: 'Crackers and cheese / granola bar', sub: false },
    { id: 'fruits',      type: 'task',   label: 'Fruits', sub: false },
  ];

  // The checklist LAYOUT (categories + tasks) lives in the shared Drive
  // file (my-checklists-data.json) and is the source of truth for every
  // device. Only the web version (a real mouse/trackpad — isDesktop
  // below) is allowed to write it: add/rename/delete/reorder tasks and
  // categories. The mobile version (iPhone/iPad) only ever READS this
  // key from Drive and re-renders whenever it changes elsewhere.
  //
  // Done-state (which boxes are ticked) is NOT written to Drive at all —
  // it's local to each device's browser (localStorage), keyed by today's
  // date so it clears itself automatically every day. That's deliberate:
  // it's today's to-do progress, not something that needs to follow you
  // between devices, and keeping it local means tapping a box on the
  // phone never touches the network or the shared file.
  const ITEMS_KEY = 'ft-checklist-items-v1';
  const doneKeyForToday = () => 'ft-checklist-done-' + new Date().toISOString().slice(0, 10);

  const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (isDesktop) document.body.classList.add('is-desktop');

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  let items = DEFAULT_ITEMS.slice();
  let doneState = {};

  const listEl = document.getElementById('taskList');
  const loadingNote = document.getElementById('loadingNote');
  const countLabel = document.getElementById('countLabel');
  const barFill = document.getElementById('barFill');
  let dragId = null;

  // Layout writes are desktop-only — the mobile UI never exposes the
  // controls that call this, but the guard makes it a hard rule rather
  // than just a hidden button.
  async function saveItems() {
    if (!isDesktop) return;
    await OT.set(ITEMS_KEY, JSON.stringify(items));
  }

  function loadDone() {
    try {
      const raw = localStorage.getItem(doneKeyForToday());
      doneState = raw ? JSON.parse(raw) : {};
    } catch (e) { doneState = {}; }
  }

  function saveDone() {
    try {
      localStorage.setItem(doneKeyForToday(), JSON.stringify(doneState));
    } catch (e) {}
  }

  function render() {
    listEl.innerHTML = '';
    items.forEach((item, idx) => {
      if (item.type === 'header') {
        const tasksInSection = sectionTaskCount(idx);
        const li = document.createElement('li');
        li.className = 'section-header';
        li.dataset.id = item.id;

        const iconSpan = document.createElement('span');
        iconSpan.className = 'sec-icon';
        iconSpan.textContent = item.icon || '';
        li.appendChild(iconSpan);

        const labelSpan = document.createElement('span');
        labelSpan.className = 'sec-label';
        labelSpan.textContent = item.label;
        if (isDesktop) labelSpan.addEventListener('dblclick', () => startEditHeader(labelSpan, item));
        li.appendChild(labelSpan);

        const right = document.createElement('span');
        right.className = 'sec-right';

        if (tasksInSection.total) {
          const prog = document.createElement('span');
          prog.className = 'sec-progress';
          prog.textContent = tasksInSection.done + '/' + tasksInSection.total;
          right.appendChild(prog);
        }

        const del = document.createElement('button');
        del.className = 'sec-del';
        del.setAttribute('aria-label', 'Delete category');
        del.textContent = '\u00D7';
        del.addEventListener('click', e => {
          e.stopPropagation();
          deleteCategory(item.id);
        });
        right.appendChild(del);

        li.appendChild(right);

        if (isDesktop) {
          li.setAttribute('draggable', 'true');
          li.style.cursor = 'grab';
          li.addEventListener('dragstart', e => {
            dragId = item.id;
            e.dataTransfer.effectAllowed = 'move';
          });
          li.addEventListener('dragover', e => { e.preventDefault(); });
          li.addEventListener('drop', e => {
            e.preventDefault();
            if (!dragId || dragId === item.id) return;
            const fromIdx = items.findIndex(i => i.id === dragId);
            const toIdx = items.findIndex(i => i.id === item.id);
            const [moved] = items.splice(fromIdx, 1);
            items.splice(toIdx, 0, moved);
            dragId = null;
            saveItems();
            render();
          });
        }

        listEl.appendChild(li);
        return;
      }

      const li = document.createElement('li');
      li.className = 'task' + (doneState[item.id] ? ' done' : '') + (item.sub ? ' sub' : '');
      li.dataset.id = item.id;

      if (isDesktop) {
        const grip = document.createElement('span');
        grip.className = 'grip';
        grip.setAttribute('draggable', 'true');
        grip.textContent = '\u22EE\u22EE';
        grip.addEventListener('dragstart', e => {
          dragId = item.id;
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        grip.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.appendChild(grip);

        li.addEventListener('dragover', e => {
          e.preventDefault();
          li.classList.add('drag-over');
        });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', e => {
          e.preventDefault();
          li.classList.remove('drag-over');
          if (!dragId || dragId === item.id) return;
          const fromIdx = items.findIndex(i => i.id === dragId);
          const toIdx = items.findIndex(i => i.id === item.id);
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          dragId = null;
          saveItems();
          render();
        });

        const indentBtn = document.createElement('button');
        const prevIsHeader = idx === 0 || items[idx - 1].type === 'header';
        if (prevIsHeader) {
          indentBtn.className = 'indent-btn spacer';
          indentBtn.textContent = '\u25B8';
        } else {
          indentBtn.className = 'indent-btn';
          indentBtn.textContent = item.sub ? '\u25C2' : '\u25B8';
          indentBtn.setAttribute('aria-label', item.sub ? 'Make top-level task' : 'Make subtask');
          indentBtn.addEventListener('click', () => {
            item.sub = !item.sub;
            saveItems();
            render();
          });
        }
        li.appendChild(indentBtn);
      }

      const box = document.createElement('span');
      box.className = 'box';
      box.innerHTML = CHECK_SVG;
      box.addEventListener('click', () => toggleDone(item.id));
      li.appendChild(box);

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = item.label;

      if (isDesktop) {
        label.addEventListener('dblclick', () => startEdit(label, item));
      } else {
        li.addEventListener('click', () => toggleDone(item.id));
      }

      li.appendChild(label);

      if (isDesktop) {
        const del = document.createElement('button');
        del.className = 'del';
        del.setAttribute('aria-label', 'Delete task');
        del.textContent = '\u00D7';
        del.addEventListener('click', e => {
          e.stopPropagation();
          items = items.filter(i => i.id !== item.id);
          delete doneState[item.id];
          saveItems();
          saveDone();
          render();
        });
        li.appendChild(del);
      }

      listEl.appendChild(li);
    });
    updateProgress();
  }

  function sectionTaskCount(headerIdx) {
    let total = 0, done = 0;
    for (let i = headerIdx + 1; i < items.length && items[i].type !== 'header'; i++) {
      total++;
      if (doneState[items[i].id]) done++;
    }
    return { total, done };
  }

  function startEdit(label, item) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'label-input';
    input.value = item.label;
    label.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      if (val) item.label = val;
      saveItems();
      render();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); render(); }
    });
    input.addEventListener('blur', commit);
  }

  function startEditHeader(labelSpan, item) {
    if (!isDesktop) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'label-input';
    input.value = item.label;
    labelSpan.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      if (val) item.label = val;
      saveItems();
      render();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); render(); }
    });
    input.addEventListener('blur', commit);
  }

  function deleteCategory(headerId) {
    if (!isDesktop) return;
    const headerIdx = items.findIndex(i => i.id === headerId);
    if (headerIdx === -1) return;
    const header = items[headerIdx];
    if (!confirm('Delete "' + header.label + '" and all its tasks?')) return;

    let endIdx = headerIdx + 1;
    while (endIdx < items.length && items[endIdx].type !== 'header') endIdx++;

    const removed = items.slice(headerIdx, endIdx);
    removed.forEach(i => delete doneState[i.id]);
    items.splice(headerIdx, endIdx - headerIdx);

    saveItems();
    saveDone();
    render();
  }

  function addCategory() {
    if (!isDesktop) return;
    const label = prompt('Name for new category:', 'New Category');
    if (!label || !label.trim()) return;
    const id = 'h-custom-' + Date.now().toString(36);
    items.push({ id, type: 'header', icon: '📋', label: label.trim() });
    saveItems();
    render();
  }

  function toggleDone(id) {
    doneState[id] = !doneState[id];
    saveDone();
    render();
  }

  function updateProgress() {
    const tasks = items.filter(i => i.type !== 'header');
    const done = tasks.filter(i => doneState[i.id]).length;
    countLabel.textContent = done + '/' + tasks.length;
    barFill.style.width = (tasks.length ? (done / tasks.length * 100) : 0) + '%';
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    doneState = {};
    saveDone();
    render();
  });

  const addInput = document.getElementById('addInput');
  const addBtn = document.getElementById('addBtn');

  function addTask() {
    const val = addInput.value.trim();
    if (!val) return;
    const id = 'task-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    items.push({ id, type: 'task', label: val, sub: false });
    saveItems();
    addInput.value = '';
    render();
  }

  addBtn.addEventListener('click', addTask);
  addInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  document.getElementById('addCategoryBtn').addEventListener('click', addCategory);

  // Local done-state loads instantly, no network needed.
  loadDone();

  async function loadFromDrive() {
    const savedItems = await OT.get(ITEMS_KEY);

    if (savedItems) {
      try {
        items = JSON.parse(savedItems);
        items.forEach(i => { if (i.type !== 'header' && typeof i.sub !== 'boolean') i.sub = false; });
      } catch (e) {}
    } else if (isDesktop) {
      // First run ever: seed Drive with the defaults so every device starts
      // the same. Only the web version is allowed to write this key —
      // mobile just waits and re-renders once the web version has saved.
      await saveItems();
    }

    loadingNote.style.display = 'none';
    listEl.style.display = '';
    render();
  }

  // Renders once from whatever's cached locally (works instantly, even
  // offline), then re-renders when the authoritative Drive data lands —
  // and again any time it changes, e.g. edited on another device.
  OT.onReady(loadFromDrive);
  OT.onSync(loadFromDrive);
</script>
</body>
</html>
