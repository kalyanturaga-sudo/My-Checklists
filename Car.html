<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Checklist</title>
<style>
  :root {
    --bg: #17151d;
    --card: #211e29;
    --card-border: #322e3d;
    --accent: #6366f1;
    --text: #f2f1f6;
    --text-dim: #8b8798;
    --done: #55506333;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 24px);
  }

  header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px 20px;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(160deg, #4f7cff, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .title-block { flex: 1; min-width: 0; }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: -0.2px;
  }

  .date {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
    margin-top: 3px;
  }

  .count {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }

  .bar-track {
    height: 3px;
    background: var(--card-border);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 4px 16px;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* Text-answer item (destination question), lives as the first list card */
  .text-wrap { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .text-ans {
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    width: 100%;
  }
  .text-ans:focus { border-color: var(--accent); }
  .text-ans::placeholder { color: var(--text-dim); }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 14px;
    transition: background 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  li.task.done {
    background: var(--done);
    opacity: 0.55;
  }

  li.task.drag-over { box-shadow: 0 0 0 2px var(--accent); }
  li.task.dragging { opacity: 0.35; }

  .grip {
    display: none;
    width: 18px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    letter-spacing: -1px;
    cursor: grab;
    user-select: none;
    margin-top: 1px;
  }

  body.is-desktop .grip { display: block; }
  body.is-desktop li.task { cursor: default; }
  .grip:active { cursor: grabbing; }

  .box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    cursor: pointer;
  }

  .box.sub { width: 19px; height: 19px; border-radius: 5px; }

  li.task.done .box, .subrow.done .box { background: var(--accent); }

  .box svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s ease; }
  .box.sub svg { width: 11px; height: 11px; }

  li.task.done .box svg, .subrow.done .box svg { opacity: 1; }

  .label { font-size: 16px; line-height: 1.35; padding-top: 1px; flex: 1; min-width: 0; }

  li.task.done .label { text-decoration: line-through; text-decoration-color: var(--text-dim); }

  body.is-desktop .label { cursor: text; }

  .label-input {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 3px 6px;
    width: 100%;
    line-height: 1.35;
  }

  .del {
    display: none;
    width: 22px; height: 22px; flex-shrink: 0;
    align-items: center; justify-content: center;
    border: none; background: none;
    color: var(--text-dim);
    font-size: 16px; line-height: 1;
    border-radius: 6px; cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  body.is-desktop .del { display: flex; }
  body.is-desktop li.task:hover .del { opacity: 1; }
  .del:hover { background: #ef444422; color: #ef4444; }

  /* Grouped sub-checklist (clothing) */
  .group-wrap { display: flex; flex-direction: column; gap: 10px; width: 100%; min-width: 0; }
  .group-label { font-size: 16px; line-height: 1.35; padding-top: 1px; }
  .sublist { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  .subrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 4px;
  }

  .sub-label { font-size: 14.5px; color: var(--text-dim); }
  .subrow.done .sub-label { text-decoration: line-through; }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin: 4px 0 0;
    display: none;
  }

  body.is-desktop .hint { display: block; }

  .loading-note { text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px 0; }

  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 26px; padding-bottom: 6px; }

  .reset {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
  }

  .reset:active { background: var(--card); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="icon">🚗</div>
    <div class="title-block">
      <h1>Car Checklist</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="progress">
      <span class="count" id="countLabel">0/9</span>
    </div>
  </header>

  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  <div id="loadingNote" class="loading-note">Loading checklist&hellip;</div>
  <ul class="tasks" id="taskList" style="display:none;"></ul>

  <p class="hint">Drag &#8942;&#8942; to reorder &middot; double-click text to edit &middot; &times; to delete &middot; changes sync to every device</p>

  <button class="reset" id="resetBtn">Reset checklist</button>

  <footer>Car Checklist &middot; tap a row to check it off</footer>

</div>

<script src="storage.js"></script>
<script>
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  // 'text' = a question answered with free text (destination). 'clothing' is a
  // group with its own sub-checkboxes. Everything else is a flat task.
  const DEFAULT_ITEMS = [
    { id: 'destination', type: 'text', label: "What's the destination? Why are you going?" },
    { id: 'clothing', type: 'group', label: 'Wearing appropriate clothes', subItems: [
        { id: 'shoes',    label: 'Shoes' },
        { id: 'pants',    label: 'Pants' },
        { id: 'slippers', label: 'Slippers' },
      ] },
    { id: 'water-bottle',   type: 'task', label: 'Water bottle' },
    { id: 'shopping-bags',  type: 'task', label: 'Shopping bags' },
    { id: 'audiobook',      type: 'task', label: 'Audiobook ready to play' },
    { id: 'petrol',         type: 'task', label: 'Petrol in the car' },
  ];

  const ITEMS_KEY = 'car-checklist-items-v1';
  const todayStamp = () => new Date().toISOString().slice(0, 10);
  const doneKeyForToday = () => 'car-checklist-done-' + todayStamp();
  const textKeyForToday = () => 'car-checklist-text-' + todayStamp();

  const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (isDesktop) document.body.classList.add('is-desktop');

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  let items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  let doneState = {}; // flat map: task/text id -> bool, or "clothing:shoes" -> bool for sub items
  let textAnswers = {}; // text-item id -> the typed answer

  const listEl = document.getElementById('taskList');
  const loadingNote = document.getElementById('loadingNote');
  const countLabel = document.getElementById('countLabel');
  const barFill = document.getElementById('barFill');
  let dragId = null;

  function flatIds() {
    const ids = [];
    items.forEach(it => {
      if (it.type === 'group') it.subItems.forEach(s => ids.push(it.id + ':' + s.id));
      else ids.push(it.id);
    });
    return ids;
  }

  async function saveItems() { await OT.set(ITEMS_KEY, JSON.stringify(items)); }
  async function saveDone()  { await OT.set(doneKeyForToday(), JSON.stringify(doneState)); }
  async function saveText()  { await OT.set(textKeyForToday(), JSON.stringify(textAnswers)); }

  function render() {
    listEl.innerHTML = '';

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'task';
      li.dataset.id = item.id;

      if (isDesktop) {
        const grip = document.createElement('span');
        grip.className = 'grip';
        grip.setAttribute('draggable', 'true');
        grip.textContent = '\u22EE\u22EE';
        grip.addEventListener('dragstart', e => {
          dragId = item.id;
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        grip.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.appendChild(grip);

        li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('drag-over'); });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', e => {
          e.preventDefault();
          li.classList.remove('drag-over');
          if (!dragId || dragId === item.id) return;
          const fromIdx = items.findIndex(i => i.id === dragId);
          const toIdx = items.findIndex(i => i.id === item.id);
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          dragId = null;
          saveItems();
          render();
        });
      }

      if (item.type === 'text') {
        li.classList.toggle('done', !!doneState[item.id]);

        const box = document.createElement('span');
        box.className = 'box';
        box.innerHTML = CHECK_SVG;
        li.appendChild(box);

        const wrap = document.createElement('div');
        wrap.className = 'text-wrap';

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;
        if (isDesktop) label.addEventListener('dblclick', () => startEdit(label, item));
        wrap.appendChild(label);

        const ans = document.createElement('input');
        ans.type = 'text';
        ans.className = 'text-ans';
        ans.placeholder = 'Type your answer\u2026';
        ans.value = textAnswers[item.id] || '';
        ans.addEventListener('click', e => e.stopPropagation());
        ans.addEventListener('blur', () => {
          textAnswers[item.id] = ans.value;
          doneState[item.id] = ans.value.trim().length > 0;
          saveText();
          saveDone();
          li.classList.toggle('done', !!doneState[item.id]);
        });
        ans.addEventListener('keydown', e => { if (e.key === 'Enter') ans.blur(); });
        wrap.appendChild(ans);

        li.appendChild(wrap);

      } else if (item.type === 'group') {
        const allDone = item.subItems.every(s => doneState[item.id + ':' + s.id]);
        li.classList.toggle('done', allDone);

        const box = document.createElement('span');
        box.className = 'box';
        box.innerHTML = CHECK_SVG;
        box.addEventListener('click', () => {
          const newVal = !allDone;
          item.subItems.forEach(s => { doneState[item.id + ':' + s.id] = newVal; });
          saveDone();
          render();
        });
        li.appendChild(box);

        const groupWrap = document.createElement('div');
        groupWrap.className = 'group-wrap';

        const label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = item.label;
        groupWrap.appendChild(label);

        const sub = document.createElement('ul');
        sub.className = 'sublist';
        item.subItems.forEach(s => {
          const key = item.id + ':' + s.id;
          const row = document.createElement('li');
          row.className = 'subrow' + (doneState[key] ? ' done' : '');

          const sbox = document.createElement('span');
          sbox.className = 'box sub';
          sbox.innerHTML = CHECK_SVG;
          sbox.addEventListener('click', () => {
            doneState[key] = !doneState[key];
            saveDone();
            render();
          });
          row.appendChild(sbox);

          const slabel = document.createElement('span');
          slabel.className = 'sub-label';
          slabel.textContent = s.label;
          row.appendChild(slabel);

          if (!isDesktop) row.addEventListener('click', () => sbox.click());

          sub.appendChild(row);
        });
        groupWrap.appendChild(sub);
        li.appendChild(groupWrap);

      } else {
        li.classList.toggle('done', !!doneState[item.id]);

        const box = document.createElement('span');
        box.className = 'box';
        box.innerHTML = CHECK_SVG;
        box.addEventListener('click', () => toggleDone(item.id));
        li.appendChild(box);

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;

        if (isDesktop) {
          label.addEventListener('dblclick', () => startEdit(label, item));
        } else {
          li.addEventListener('click', () => toggleDone(item.id));
        }
        li.appendChild(label);

        if (isDesktop) {
          const del = document.createElement('button');
          del.className = 'del';
          del.setAttribute('aria-label', 'Delete task');
          del.textContent = '\u00D7';
          del.addEventListener('click', e => {
            e.stopPropagation();
            items = items.filter(i => i.id !== item.id);
            delete doneState[item.id];
            saveItems();
            saveDone();
            render();
          });
          li.appendChild(del);
        }
      }

      listEl.appendChild(li);
    });

    updateProgress();
  }

  function startEdit(label, item) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'label-input';
    input.value = item.label;
    label.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      if (val) item.label = val;
      saveItems();
      render();
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); render(); }
    });
    input.addEventListener('blur', commit);
  }

  function toggleDone(id) {
    doneState[id] = !doneState[id];
    saveDone();
    updateProgress();
    const li = listEl.querySelector('li[data-id="' + id + '"]');
    if (li) li.classList.toggle('done', !!doneState[id]);
  }

  function updateProgress() {
    const ids = flatIds();
    const done = ids.filter(id => doneState[id]).length;
    countLabel.textContent = done + '/' + ids.length;
    barFill.style.width = (ids.length ? (done / ids.length * 100) : 0) + '%';
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    doneState = {};
    saveDone();
    render();
  });

  async function loadFromDrive() {
    const savedItems = await OT.get(ITEMS_KEY);
    const savedDone  = await OT.get(doneKeyForToday());
    const savedText  = await OT.get(textKeyForToday());

    if (savedItems) {
      try { items = JSON.parse(savedItems); } catch (e) {}
    } else {
      await saveItems();
    }
    if (savedDone) { try { doneState = JSON.parse(savedDone); } catch (e) {} }
    if (savedText) { try { textAnswers = JSON.parse(savedText); } catch (e) {} }

    loadingNote.style.display = 'none';
    listEl.style.display = '';
    render();
  }

  OT.onReady(loadFromDrive);
  OT.onSync(loadFromDrive);
</script>
</body>
</html>
