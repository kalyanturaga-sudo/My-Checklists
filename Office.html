<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Room Opening</title>
<style>
  :root {
    --bg: #17151d;
    --card: #211e29;
    --card-border: #322e3d;
    --accent: #6366f1;
    --text: #f2f1f6;
    --text-dim: #8b8798;
    --done: #55506333;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 24px);
  }

  header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px 20px;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(160deg, #4f7cff, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .title-block { flex: 1; min-width: 0; }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: -0.2px;
  }

  .date {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
    margin-top: 3px;
  }

  .count {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }

  .bar-track {
    height: 3px;
    background: var(--card-border);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 4px 18px;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 14px;
    transition: background 0.15s ease, opacity 0.15s ease;
  }

  li.task.done {
    background: var(--done);
    opacity: 0.55;
  }

  .box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  li.task.done .box {
    background: var(--accent);
  }

  .box svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }

  li.task.done .box svg { opacity: 1; }

  .label {
    font-size: 16px;
    line-height: 1.35;
    padding-top: 1px;
  }

  li.task.done .label {
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 26px;
    padding-bottom: 6px;
  }

  .reset {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
  }

  .reset:active { background: var(--card); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="icon">🖥️</div>
    <div class="title-block">
      <h1>Office Room Opening</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="progress">
      <span class="count" id="countLabel">0/9</span>
    </div>
  </header>

  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  <ul class="tasks" id="taskList">
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Clear the floor</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Clean the table</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Wet clean monitors, keyboard, mouse, table top</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Water bottle</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Munchings</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Charged headphones and iPad</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Toupee &ndash; wear it</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Go to potty</span></li>
    <li class="task"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="label">Put iPad on the desk</span></li>
  </ul>

  <button class="reset" id="resetBtn">Reset checklist</button>

  <footer>Office Room Opening &middot; tap a row to check it off</footer>

</div>

<script>
  const dateEl = document.getElementById('today');
  dateEl.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const STORAGE_KEY = 'office-room-opening-' + new Date().toDateString();
  const items = Array.from(document.querySelectorAll('li.task'));
  const countLabel = document.getElementById('countLabel');
  const barFill = document.getElementById('barFill');

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      items.forEach((li, i) => { if (saved[i]) li.classList.add('done'); });
    } catch (e) {}
  }

  function saveState() {
    const state = items.map(li => li.classList.contains('done'));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function updateProgress() {
    const done = items.filter(li => li.classList.contains('done')).length;
    countLabel.textContent = done + '/' + items.length;
    barFill.style.width = (done / items.length * 100) + '%';
  }

  items.forEach(li => {
    li.addEventListener('click', () => {
      li.classList.toggle('done');
      saveState();
      updateProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    items.forEach(li => li.classList.remove('done'));
    saveState();
    updateProgress();
  });

  loadState();
  updateProgress();
</script>
</body>
</html>
