<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Room Opening</title>
<style>
  :root {
    --bg: #17151d;
    --card: #211e29;
    --card-border: #322e3d;
    --accent: #6366f1;
    --text: #f2f1f6;
    --text-dim: #8b8798;
    --done: #55506333;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 24px);
  }

  header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px 20px;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(160deg, #4f7cff, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .title-block { flex: 1; min-width: 0; }

  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 2px;
    letter-spacing: -0.2px;
  }

  .date {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    flex-shrink: 0;
    margin-top: 3px;
  }

  .count {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-variant-numeric: tabular-nums;
  }

  .bar-track {
    height: 3px;
    background: var(--card-border);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 4px 18px;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 14px;
    transition: background 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  li.task.done {
    background: var(--done);
    opacity: 0.55;
  }

  li.task.drag-over {
    box-shadow: 0 0 0 2px var(--accent);
  }

  li.task.dragging {
    opacity: 0.35;
  }

  /* Drag handle — desktop (mouse) only, hidden entirely on touch/iPhone */
  .grip {
    display: none;
    width: 18px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 22px;
    text-align: center;
    letter-spacing: -1px;
    cursor: grab;
    user-select: none;
    margin-top: 1px;
  }

  body.is-desktop .grip { display: block; }
  body.is-desktop li.task { cursor: default; }
  .grip:active { cursor: grabbing; }

  .box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    cursor: pointer;
  }

  li.task.done .box {
    background: var(--accent);
  }

  .box svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }

  li.task.done .box svg { opacity: 1; }

  .label {
    font-size: 16px;
    line-height: 1.35;
    padding-top: 1px;
    flex: 1;
    min-width: 0;
  }

  li.task.done .label {
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  body.is-desktop .label { cursor: text; }

  .label-input {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 3px 6px;
    width: 100%;
    line-height: 1.35;
  }

  .hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin: 4px 0 0;
    display: none;
  }

  body.is-desktop .hint { display: block; }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 26px;
    padding-bottom: 6px;
  }

  .reset {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
  }

  .reset:active { background: var(--card); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="icon">🖥️</div>
    <div class="title-block">
      <h1>Office Room Opening</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="progress">
      <span class="count" id="countLabel">0/9</span>
    </div>
  </header>

  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  <ul class="tasks" id="taskList"></ul>

  <p class="hint">Drag &#8942;&#8942; to reorder &middot; double-click text to edit</p>

  <button class="reset" id="resetBtn">Reset checklist</button>

  <footer>Office Room Opening &middot; tap a row to check it off</footer>

</div>

<script>
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  const DEFAULT_ITEMS = [
    { id: 'clear-floor',      label: 'Clear the floor' },
    { id: 'clean-table',      label: 'Clean the table' },
    { id: 'wet-clean',        label: 'Wet clean monitors, keyboard, mouse, table top' },
    { id: 'water-bottle',     label: 'Water bottle' },
    { id: 'munchings',        label: 'Munchings' },
    { id: 'headphones-ipad',  label: 'Charged headphones and iPad' },
    { id: 'toupee',           label: 'Toupee \u2013 wear it' },
    { id: 'potty',            label: 'Go to potty' },
    { id: 'ipad-desk',        label: 'Put iPad on the desk' },
  ];

  const ITEMS_KEY = 'office-checklist-items-v1';
  const doneKeyForToday = () => 'office-checklist-done-' + new Date().toDateString();

  // Desktop = has a real mouse (hover + fine pointer). iPhone/touch never
  // matches this, so editing/reordering only ever appears on the web version.
  const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (isDesktop) document.body.classList.add('is-desktop');

  document.getElementById('today').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function loadItems() {
    try {
      const saved = JSON.parse(localStorage.getItem(ITEMS_KEY));
      if (Array.isArray(saved) && saved.length) return saved;
    } catch (e) {}
    return DEFAULT_ITEMS.slice();
  }

  function saveItems() {
    localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
  }

  function loadDone() {
    try { return JSON.parse(localStorage.getItem(doneKeyForToday())) || {}; }
    catch (e) { return {}; }
  }

  function saveDone() {
    localStorage.setItem(doneKeyForToday(), JSON.stringify(doneState));
  }

  let items = loadItems();
  let doneState = loadDone();

  const listEl = document.getElementById('taskList');
  const countLabel = document.getElementById('countLabel');
  const barFill = document.getElementById('barFill');
  let dragId = null;

  function render() {
    listEl.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'task' + (doneState[item.id] ? ' done' : '');
      li.dataset.id = item.id;

      if (isDesktop) {
        const grip = document.createElement('span');
        grip.className = 'grip';
        grip.setAttribute('draggable', 'true');
        grip.textContent = '\u22EE\u22EE';
        grip.addEventListener('dragstart', e => {
          dragId = item.id;
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        grip.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.appendChild(grip);

        li.addEventListener('dragover', e => {
          e.preventDefault();
          li.classList.add('drag-over');
        });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', e => {
          e.preventDefault();
          li.classList.remove('drag-over');
          if (!dragId || dragId === item.id) return;
          const fromIdx = items.findIndex(i => i.id === dragId);
          const toIdx = items.findIndex(i => i.id === item.id);
          const [moved] = items.splice(fromIdx, 1);
          items.splice(toIdx, 0, moved);
          dragId = null;
          saveItems();
          render();
        });
      }

      const box = document.createElement('span');
      box.className = 'box';
      box.innerHTML = CHECK_SVG;
      box.addEventListener('click', () => toggleDone(item.id));
      li.appendChild(box);

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = item.label;

      if (isDesktop) {
        label.addEventListener('dblclick', () => startEdit(li, label, item));
      } else {
        // iPhone / touch: whole row is a big tap target, read-only text
        li.addEventListener('click', () => toggleDone(item.id));
      }

      li.appendChild(label);
      listEl.appendChild(li);
    });
    updateProgress();
  }

  function startEdit(li, label, item) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'label-input';
    input.value = item.label;
    label.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      if (val) item.label = val;
      saveItems();
      render();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); render(); }
    });
    input.addEventListener('blur', commit);
  }

  function toggleDone(id) {
    doneState[id] = !doneState[id];
    saveDone();
    updateProgress();
    const li = listEl.querySelector('li[data-id="' + id + '"]');
    if (li) li.classList.toggle('done', !!doneState[id]);
  }

  function updateProgress() {
    const done = items.filter(i => doneState[i.id]).length;
    countLabel.textContent = done + '/' + items.length;
    barFill.style.width = (items.length ? (done / items.length * 100) : 0) + '%';
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    doneState = {};
    saveDone();
    render();
  });

  render();
</script>
</body>
</html>
